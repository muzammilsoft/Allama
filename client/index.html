<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>علّامة - Allama</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        .markdown-content pre { background: #1e1e1e; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
        .markdown-content code { font-family: monospace; }
        .dark { background-color: #111827; color: white; }
        .dark .bg-white { background-color: #1f2937; color: white; }
        .dark .text-gray-900 { color: #f3f4f6; }
        .dark .text-gray-700 { color: #d1d5db; }
        .dark .border-gray-200 { border-color: #374151; }
    </style>
</head>
<body class="h-full bg-gray-50 transition-colors duration-200">
    <div class="flex h-full overflow-hidden">
        <aside id="sidebar" class="fixed inset-y-0 right-0 z-50 w-72 bg-white border-l border-gray-200 transform translate-x-full transition-transform duration-300 ease-in-out lg:relative lg:translate-x-0">
            <div class="flex flex-col h-full">
                <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                    <h2 class="text-xl font-bold">المحادثات</h2>
                    <button onclick="newChat()" class="p-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"><i class="fas fa-plus"></i></button>
                </div>
                <div id="session-list" class="flex-1 overflow-y-auto p-2 space-y-2"></div>
            </div>
        </aside>
        <main class="flex-1 flex flex-col h-full relative">
            <header class="bg-white border-b border-gray-200 p-4 flex justify-between items-center z-10">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="lg:hidden p-2 text-gray-600 hover:bg-gray-100 rounded"><i class="fas fa-bars"></i></button>
                    <h1 class="text-2xl font-bold text-blue-600">علّامة</h1>
                    <select id="model-select" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                        <option value="">تحميل النماذج...</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="toggleDarkMode()" class="p-2 text-gray-600 hover:bg-gray-100 rounded" title="الوضع الليلي"><i id="dark-mode-icon" class="fas fa-moon"></i></button>
                    <button onclick="openSettings()" class="p-2 text-gray-600 hover:bg-gray-100 rounded" title="الإعدادات"><i class="fas fa-cog"></i></button>
                </div>
            </header>
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="flex justify-center items-center h-full text-gray-400">
                    <div class="text-center">
                        <i class="fas fa-robot text-6xl mb-4"></i>
                        <p class="text-xl">ابدأ محادثة جديدة مع علّامة</p>
                    </div>
                </div>
            </div>
            <div class="p-4 bg-white border-t border-gray-200">
                <div id="image-preview" class="hidden mb-2 relative inline-block">
                    <img id="preview-img" src="" class="h-20 w-20 object-cover rounded border border-gray-300">
                    <button onclick="removeImage()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs"><i class="fas fa-times"></i></button>
                </div>
                <div class="flex gap-2">
                    <button id="image-btn" onclick="triggerImageUpload()" class="p-3 text-gray-500 hover:bg-gray-100 rounded-lg disabled:opacity-50" title="إرسال صورة"><i class="fas fa-image"></i></button>
                    <input type="file" id="image-input" class="hidden" accept="image/*" onchange="handleImageSelect(event)">
                    <textarea id="user-input" rows="1" class="flex-1 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 resize-none" placeholder="اكتب رسالتك هنا..."></textarea>
                    <button onclick="sendMessage()" id="send-btn" class="p-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-400"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </main>
    </div>
    <div id="settings-modal" class="hidden fixed inset-0 z-[60] overflow-y-auto bg-black bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold">إعدادات النموذج</h3>
                    <button onclick="closeSettings()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">رسالة النظام (System Message)</label>
                        <textarea id="system-prompt" rows="3" class="mt-1 block w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm" placeholder="أنت مساعد ذكي ومتعاون..."></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">درجة الحرارة (Temperature)</label>
                        <input type="range" id="temp-range" min="0" max="2" step="0.1" value="0.7" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        <div class="flex justify-between text-xs text-gray-500"><span>0.0</span><span id="temp-val">0.7</span><span>2.0</span></div>
                    </div>
                    <div class="flex items-center">
                        <input id="tools-enabled" type="checkbox" checked class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500">
                        <label for="tools-enabled" class="mr-2 text-sm font-medium text-gray-700">تفعيل الأدوات (Function Calling)</label>
                    </div>
                    <div class="pt-4 border-t border-gray-200">
                        <h4 class="text-sm font-bold mb-2">إضافة نموذج جديد</h4>
                        <div class="flex gap-2">
                            <input id="new-model-name" type="text" class="flex-1 bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm" placeholder="اسم النموذج (e.g. llama3)">
                            <button onclick="addNewModel()" class="bg-green-600 text-white px-3 py-1 rounded-lg text-sm hover:bg-green-700">إضافة</button>
                        </div>
                    </div>
                </div>
                <div class="mt-6"><button onclick="saveSettings()" class="w-full bg-blue-600 text-white rounded-lg py-2 hover:bg-blue-700">حفظ الإعدادات</button></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
