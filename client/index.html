<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>علّامة - Allama</title>
    <script src="lib/tailwind.js"></script>
    <link rel="stylesheet" href="lib/fontawesome.min.css">
    <script src="lib/marked.min.js"></script>
    <script src="lib/purify.min.js"></script>
    <link rel="stylesheet" href="lib/github-dark.min.css">
    <script src="lib/highlight.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; }
        .markdown-content pre { background: #f3f4f6; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; border: 1px solid #e5e7eb; }
        .dark .markdown-content pre { background: #111827; border-color: #374151; }
        .markdown-content code { font-family: monospace; }

        /* Ollama minimalist style */
        .bg-ollama-white { background-color: #ffffff; }
        .bg-ollama-black { background-color: #000000; }

        .dark { background-color: #000000; color: #ffffff; }
        .dark .bg-white { background-color: #111111; color: #ffffff; }
        .dark .border-gray-200 { border-color: #222222; }

        /* Loading animation */
        .dot-flashing {
            position: relative;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #3b82f6;
            color: #3b82f6;
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: 0.5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: "";
            display: inline-block;
            position: absolute;
            top: 0;
        }
        .dot-flashing::before {
            left: -12px;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #3b82f6;
            color: #3b82f6;
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: 0s;
        }
        .dot-flashing::after {
            left: 12px;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #3b82f6;
            color: #3b82f6;
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: 1s;
        }
        @keyframes dot-flashing {
            0% { background-color: #3b82f6; }
            50%, 100% { background-color: #ebe6ff; }
        }

        /* Thinking section */
        .thinking-block {
            border-right: 3px solid #3b82f6;
            margin-bottom: 1rem;
            padding-right: 1rem;
            color: #6b7280;
            font-size: 0.875rem;
            font-style: italic;
            background-color: #f9fafb;
            padding: 0.75rem;
            border-radius: 0.5rem;
        }
        .dark .thinking-block {
            border-color: #2563eb;
            color: #9ca3af;
            background-color: #111111;
        }
    </style>
</head>
<body class="h-full bg-white dark:bg-black transition-colors duration-200">
    <div class="flex h-full overflow-hidden relative">
        <!-- Overlay for mobile sidebar -->
        <div id="sidebar-overlay" onclick="toggleSidebar(false)" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"></div>

        <!-- Sidebar (Drawer) -->
        <aside id="sidebar" class="fixed inset-y-0 right-0 z-50 w-72 bg-white dark:bg-black border-l border-gray-200 dark:border-gray-800 transform translate-x-full transition-transform duration-300 ease-in-out lg:relative lg:translate-x-0">
            <div class="flex flex-col h-full">
                <div class="p-4 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center">
                    <h2 class="text-lg font-bold">علّامة</h2>
                    <div class="flex gap-1">
                        <button onclick="openAgentStudio()" class="p-2 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-900 rounded" title="استوديو الوكلاء">
                            <i class="fas fa-robot text-xs"></i>
                        </button>
                        <button onclick="openSettings()" class="p-2 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-900 rounded" title="الإعدادات">
                            <i class="fas fa-cog text-xs"></i>
                        </button>
                        <button onclick="newChat()" class="p-2 bg-black dark:bg-white text-white dark:text-black rounded-lg hover:opacity-80">
                            <i class="fas fa-plus text-xs"></i>
                        </button>
                    </div>
                </div>
                <div class="p-4 border-b border-gray-200 dark:border-gray-800">
                    <h3 class="text-[10px] font-bold text-gray-400 uppercase mb-2">الوكلاء (Agents)</h3>
                    <div id="agent-list" class="space-y-1">
                        <!-- Agents will be here -->
                    </div>
                </div>
                <div id="session-list" class="flex-1 overflow-y-auto p-2 space-y-2"></div>

                <!-- About Developer Section -->
                <div class="p-4 border-t border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-zinc-900">
                    <h3 class="text-sm font-bold mb-2">عن المطور</h3>
                    <div class="text-xs space-y-1 text-gray-600 dark:text-gray-400">
                        <p class="font-semibold text-gray-900 dark:text-white">muzammilsoft</p>
                        <p>مطور تطبيقات وتطبيقات ويب</p>
                        <div class="flex gap-2 mt-2">
                            <a href="https://github.com/muzammilsoft" target="_blank" class="hover:text-black dark:hover:text-white"><i class="fab fa-github"></i></a>
                            <a href="https://facebook.com/khartoum.ghoul" target="_blank" class="hover:text-blue-600"><i class="fab fa-facebook"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-full relative min-w-0">
            <!-- Header -->
            <header class="bg-white dark:bg-black border-b border-gray-200 dark:border-gray-800 p-4 flex justify-between items-center z-10">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar(true)" class="lg:hidden p-2 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-900 rounded">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 id="app-title" class="text-xl md:text-2xl font-black tracking-tighter text-black dark:text-white flex items-center gap-2">
                        OLLAMA <span class="text-gray-400 font-light">علّامة</span>
                    </h1>
                </div>
                <div class="flex items-center gap-1">
                    <select id="model-select" class="bg-gray-50 dark:bg-zinc-900 border border-gray-300 dark:border-gray-800 text-gray-900 dark:text-gray-100 text-xs md:text-sm rounded-lg focus:ring-black focus:border-black block p-1 md:p-2 max-w-[100px] md:max-w-none">
                        <option value="">...</option>
                    </select>
                    <button onclick="toggleDarkMode()" class="p-2 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-900 rounded" title="الوضع الليلي">
                        <i id="dark-mode-icon" class="fas fa-moon"></i>
                    </button>
                </div>
            </header>

            <!-- Chat Area -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
                <!-- Messages will be here -->
                <div class="flex justify-center items-center h-full text-gray-300 dark:text-zinc-800">
                    <div class="text-center">
                        <i class="fas fa-terminal text-8xl mb-4"></i>
                        <p class="text-2xl font-bold italic">ALLAMA</p>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-4 bg-white dark:bg-black border-t border-gray-200 dark:border-gray-800">
                <div class="max-w-4xl mx-auto">
                    <div id="image-preview" class="hidden mb-2 relative inline-block">
                        <img id="preview-img" src="" class="h-20 w-20 object-cover rounded border border-gray-300 dark:border-gray-800">
                        <button onclick="removeImage()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shadow-lg">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="flex gap-2 items-end">
                        <button id="image-btn" onclick="triggerImageUpload()" class="p-3 text-gray-500 hover:bg-gray-100 dark:hover:bg-zinc-900 rounded-lg disabled:opacity-30" title="إرسال صورة">
                            <i class="fas fa-image"></i>
                        </button>
                        <input type="file" id="image-input" class="hidden" accept="image/*" onchange="handleImageSelect(event)">
                        <textarea id="user-input" rows="1" class="flex-1 bg-gray-50 dark:bg-zinc-900 border border-gray-300 dark:border-gray-800 text-gray-900 dark:text-gray-100 text-sm rounded-xl focus:ring-black focus:border-black block p-3 resize-none max-h-40" placeholder="اكتب رسالتك..."></textarea>
                        <button onclick="sendMessage()" id="send-btn" class="p-3 bg-black dark:bg-white text-white dark:text-black rounded-xl hover:opacity-80 disabled:opacity-30 transition-all">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    <p class="text-[10px] text-center text-gray-400 mt-2">علّامة قد يرتكب أخطاء. تحقق من المعلومات الهامة.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="hidden fixed inset-0 z-[60] overflow-y-auto bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white dark:bg-zinc-950 rounded-2xl shadow-2xl w-full max-w-md border border-gray-200 dark:border-gray-800">
            <div class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold">الإعدادات</h3>
                    <button onclick="closeSettings()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">رسالة النظام (System Message)</label>
                        <textarea id="system-prompt" rows="3" class="mt-1 block w-full bg-gray-50 dark:bg-zinc-900 border border-gray-300 dark:border-gray-800 rounded-xl p-3 text-sm" placeholder="أنت مساعد ذكي..."></textarea>
                    </div>
                    <div class="flex justify-between items-center bg-gray-50 dark:bg-zinc-900 p-3 rounded-xl border border-gray-100 dark:border-gray-800">
                        <label class="text-sm font-medium">الوضع المتدفق (Stream)</label>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input id="stream-enabled" type="checkbox" checked class="sr-only peer">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-black dark:peer-checked:bg-blue-600"></div>
                        </label>
                    </div>
                    <div class="flex justify-between items-center bg-gray-50 dark:bg-zinc-900 p-3 rounded-xl border border-gray-100 dark:border-gray-800">
                        <label class="text-sm font-medium text-gray-700 dark:text-gray-200">عرض التفكير (Show Thinking)</label>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input id="thinking-enabled" type="checkbox" checked class="sr-only peer">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-black dark:peer-checked:bg-blue-600"></div>
                        </label>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">درجة الحرارة (Temperature)</label>
                        <input type="range" id="temp-range" min="0" max="2" step="0.1" value="0.7" class="w-full h-1.5 bg-gray-200 dark:bg-gray-800 rounded-lg appearance-none cursor-pointer accent-black dark:accent-blue-600">
                        <div class="flex justify-between text-[10px] text-gray-400 mt-1">
                            <span>0.0 (دقيق)</span>
                            <span id="temp-val" class="font-bold text-black dark:text-white">0.7</span>
                            <span>2.0 (مبدع)</span>
                        </div>
                    </div>
                    <div class="pt-4 border-t border-gray-100 dark:border-gray-800">
                        <h4 class="text-xs font-bold text-gray-500 uppercase mb-2">إضافة نموذج</h4>
                        <div class="flex gap-2">
                            <input id="new-model-name" type="text" class="flex-1 bg-gray-50 dark:bg-zinc-900 border border-gray-300 dark:border-gray-800 rounded-lg p-2 text-sm" placeholder="e.g. llama3">
                            <button onclick="addNewModel()" class="bg-black dark:bg-white text-white dark:text-black px-4 py-2 rounded-lg text-sm font-bold">إضافة</button>
                        </div>
                    </div>
                </div>
                <div class="mt-8">
                    <button onclick="saveSettings()" class="w-full bg-black dark:bg-white text-white dark:text-black rounded-xl py-3 font-bold hover:opacity-90 transition-all shadow-lg">حفظ التغييرات</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Agent Studio Modal -->
    <div id="agent-modal" class="hidden fixed inset-0 z-[60] overflow-y-auto bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white dark:bg-zinc-950 rounded-2xl shadow-2xl w-full max-w-2xl border border-gray-200 dark:border-gray-800 max-h-[90vh] flex flex-col">
            <div class="p-6 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center">
                <h3 class="text-lg font-bold">استوديو الوكلاء</h3>
                <button onclick="closeAgentStudio()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">اسم الوكيل</label>
                            <input id="agent-name" type="text" class="w-full bg-gray-50 dark:bg-zinc-900 border border-gray-300 dark:border-gray-800 rounded-xl p-3 text-sm" placeholder="مثلاً: خبير البرمجة">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">أيقونة (Emoji)</label>
                            <input id="agent-icon" type="text" class="w-full bg-gray-50 dark:bg-zinc-900 border border-gray-300 dark:border-gray-800 rounded-xl p-3 text-sm" placeholder="🤖">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">النموذج المفضل</label>
                            <select id="agent-model" class="w-full bg-gray-50 dark:bg-zinc-900 border border-gray-300 dark:border-gray-800 rounded-xl p-3 text-sm">
                                <!-- Models will be here -->
                            </select>
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">رسالة النظام (التعليمات)</label>
                            <textarea id="agent-system" rows="7" class="w-full bg-gray-50 dark:bg-zinc-900 border border-gray-300 dark:border-gray-800 rounded-xl p-3 text-sm resize-none" placeholder="أنت مساعد متخصص في..."></textarea>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-3">الأدوات المفعلة (Plugins)</label>
                    <div id="plugin-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <!-- Plugins will be rendered here dynamically -->
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">القاعدة المعرفية (Knowledge Base)</label>
                    <input type="file" id="agent-files" multiple accept=".txt,.md,.json" class="block w-full text-xs text-gray-500 file:ml-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-gray-100 file:text-black dark:file:bg-zinc-800 dark:file:text-white hover:file:opacity-80 cursor-pointer">
                    <div id="agent-files-list" class="mt-2 space-y-1"></div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">درجة الحرارة (Temperature)</label>
                    <input type="range" id="agent-temp" min="0" max="2" step="0.1" value="0.7" class="w-full h-1.5 bg-gray-200 dark:bg-gray-800 rounded-lg appearance-none cursor-pointer accent-black dark:accent-blue-600">
                    <div class="flex justify-between text-[10px] text-gray-400 mt-1">
                        <span>0.0 (دقيق)</span>
                        <span id="agent-temp-val" class="font-bold text-black dark:text-white">0.7</span>
                        <span>2.0 (مبدع)</span>
                    </div>
                </div>
            </div>
            <div class="p-6 border-t border-gray-200 dark:border-gray-800">
                <button onclick="saveAgent()" class="w-full bg-black dark:bg-white text-white dark:text-black rounded-xl py-3 font-bold hover:opacity-90 shadow-lg">حفظ الوكيل</button>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="hidden fixed z-[70] bg-white dark:bg-zinc-900 border border-gray-200 dark:border-gray-800 rounded-xl shadow-2xl py-2 w-48 overflow-hidden backdrop-blur-md">
        <button onclick="copyMessage()" class="w-full text-right px-4 py-3 hover:bg-gray-100 dark:hover:bg-zinc-800 flex items-center gap-3 transition-colors">
            <i class="far fa-copy text-gray-400"></i>
            <span>نسخ النص</span>
        </button>
        <button onclick="deleteMessageUI()" class="w-full text-right px-4 py-3 hover:bg-red-50 dark:hover:bg-red-900/20 text-red-600 flex items-center gap-3 transition-colors">
            <i class="far fa-trash-alt text-red-400"></i>
            <span>حذف الرسالة</span>
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
