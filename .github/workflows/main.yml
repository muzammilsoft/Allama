name: Build Android APK

on:
  push:
    branches:
      - main # أو استبدله بـ master حسب اسم الفرع الرئيسي عندك
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بضغطة زر

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # يمكنك تغييره حسب إصدار Node بمشروعك

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Install Dependencies
        run: |
          npm install
          # إذا كنت تستخدم yarn استبدله بـ yarn install

      - name: Build Android Release (APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
